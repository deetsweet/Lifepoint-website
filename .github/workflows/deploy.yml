name: Build and publish site
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Rebuild to refresh the latest messages: Sunday 2pm and 9pm, Monday 9am (Brisbane time)
    - cron: "0 4 * * 0"
    - cron: "0 11 * * 0"
    - cron: "0 23 * * 0"
    # Nightly rebuild at 2am Brisbane time (16:00 UTC the day before; Queensland has no daylight saving),
    # so events, the latest message and the Caboolture West launch wording stay current
    - cron: "0 16 * * *"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx @11ty/eleventy
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
