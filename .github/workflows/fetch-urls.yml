name: Fetch listed images
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/fetch_urls.py | tee fetch.log
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add src/assets/img/pages
          git commit -m "Images from current lifepoint.org.au pages" || echo "nothing new"
          git push
