<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&amp;family=Lato:wght@400;700&amp;display=swap">
<section id="lifepoint-home-events" aria-labelledby="lifepoint-home-events-heading">
  <div class="lhe-inner">
    <div class="lhe-heading">
      <h2 id="lifepoint-home-events-heading">Coming up</h2>
      <a class="lhe-all" href="/events/">See all events</a>
    </div>
    <p class="lhe-status lhe-sr" role="status"{% if events.homeHtml %} hidden{% endif %}>Loading events…</p>
    <ul class="lhe-list" aria-label="Upcoming events"{% if events.homeHtml %} data-built{% endif %}>{% if events.homeHtml %}{{ events.homeHtml | safe }}{% else %}<li class="lhe-item lhe-feature lhe-skel" aria-hidden="true"><span class="lhe-link"><span class="lhe-photo"></span><span><span class="lhe-bar lhe-bar--s"></span><span class="lhe-bar"></span></span></span></li><li class="lhe-item lhe-skel" aria-hidden="true"><span class="lhe-link"><span class="lhe-photo"></span><span><span class="lhe-bar lhe-bar--s"></span><span class="lhe-bar"></span></span></span></li><li class="lhe-item lhe-skel" aria-hidden="true"><span class="lhe-link"><span class="lhe-photo"></span><span><span class="lhe-bar lhe-bar--s"></span><span class="lhe-bar"></span></span></span></li><li class="lhe-item lhe-skel" aria-hidden="true"><span class="lhe-link"><span class="lhe-photo"></span><span><span class="lhe-bar lhe-bar--s"></span><span class="lhe-bar"></span></span></span></li><li class="lhe-item lhe-skel" aria-hidden="true"><span class="lhe-link"><span class="lhe-photo"></span><span><span class="lhe-bar lhe-bar--s"></span><span class="lhe-bar"></span></span></span></li>{% endif %}</ul>
    {% if events.homeSchema %}<script type="application/ld+json" id="lhe-ld">{{ events.homeSchema | safe }}</script>{% endif %}
  </div>
</section>

<style>
#lifepoint-home-events {
  box-sizing: border-box;
  width: 100%;
  padding: clamp(28px, 5vw, 66px) clamp(16px, 5vw, 64px);
  background: #333333;
  color: #FFFBF0;
  font: 400 var(--text, 17px)/1.45 "Lato", Arial, sans-serif;
}
#lifepoint-home-events .lhe-inner { max-width: 1200px; margin: 0 auto; }
#lifepoint-home-events .lhe-heading {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 12px 20px;
  margin-bottom: clamp(18px, 3vw, 30px);
}
#lifepoint-home-events .lhe-heading h2 {
  margin: 0;
  color: #FFFBF0;
  font: 500 clamp(2.4rem, 1.7rem + 3vw, 4.5rem)/1 "Jost", Arial, sans-serif;
  letter-spacing: -.055em;
  text-align: left;
}
#lifepoint-home-events .lhe-all {
  display: inline-flex;
  align-items: center;
  min-height: 42px;
  box-sizing: border-box;
  padding: 8px 16px;
  border: 1px solid #BFCFD7;
  border-radius: 999px;
  color: #FFFBF0;
  font: 500 .9rem/1.2 "Jost", Arial, sans-serif;
  text-decoration: none;
}
#lifepoint-home-events .lhe-all:hover { background: #FFFBF0; color: #333333; }
#lifepoint-home-events a:focus-visible { outline: 2px solid #FFFBF0; outline-offset: 4px; }
#lifepoint-home-events .lhe-list {
  display: grid;
  grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
  column-gap: clamp(20px, 4vw, 52px);
  margin: 0;
  padding: 0;
  list-style: none;
}
#lifepoint-home-events .lhe-list:empty { display: none; }
#lifepoint-home-events .lhe-item { min-width: 0; margin: 0; padding: 0; }
#lifepoint-home-events .lhe-feature { grid-row: span 4; }
#lifepoint-home-events .lhe-list:has(> :only-child) {
  grid-template-columns: minmax(0, 620px);
}
#lifepoint-home-events .lhe-link {
  display: grid;
  grid-template-columns: clamp(60px, 9vw, 116px) minmax(0, 1fr) auto;
  align-items: center;
  gap: clamp(10px, 1.5vw, 18px);
  min-height: 64px;
  padding: 10px 0;
  border-bottom: 1px solid #666666;
  color: #FFFBF0;
  text-decoration: none;
  text-align: left;
}
#lifepoint-home-events .lhe-feature .lhe-link {
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 12px;
  align-content: start;
  padding: 0 0 10px;
  border: 0;
}
#lifepoint-home-events .lhe-photo {
  display: block;
  width: 100%;
  aspect-ratio: 16 / 10;
  overflow: hidden;
  border-radius: 8px;
  background: #3D6270;
}
#lifepoint-home-events .lhe-feature .lhe-photo {
  grid-column: 1 / -1;
  aspect-ratio: 16 / 9;
  border-radius: 20px 20px 12px 20px;
}
#lifepoint-home-events .lhe-photo img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
}
#lifepoint-home-events .lhe-meta {
  display: block;
  margin-bottom: 3px;
  color: #BFCFD7;
  font: 700 .735rem/1.35 "Lato", Arial, sans-serif;
  letter-spacing: .035em;
}
#lifepoint-home-events .lhe-title {
  display: block;
  color: #FFFBF0;
  font: 500 clamp(1rem, .86rem + .45vw, 1.32rem)/1.15 "Jost", Arial, sans-serif;
  overflow-wrap: anywhere;
}
#lifepoint-home-events .lhe-feature .lhe-title {
  font-size: clamp(1.55rem, 1.2rem + 1.2vw, 2.25rem);
}
#lifepoint-home-events .lhe-arrow { color: #BFCFD7; font-size: 1.125rem; }
#lifepoint-home-events .lhe-link:hover .lhe-title { text-decoration: underline; text-underline-offset: .15em; }
@media (hover: hover) {
  #lifepoint-home-events .lhe-link:hover img { filter: brightness(.78); }
}
#lifepoint-home-events .lhe-status { margin: 0; color: #BFCFD7; }
#lifepoint-home-events [hidden] { display: none !important; }
@media (max-width: 720px) {
  #lifepoint-home-events .lhe-list { grid-template-columns: minmax(0, 1fr); }
  #lifepoint-home-events .lhe-feature { grid-row: auto; margin-bottom: 8px; }
  #lifepoint-home-events .lhe-feature .lhe-link { border-bottom: 1px solid #666666; }
}
#lifepoint-home-events .lhe-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
#lifepoint-home-events .lhe-skel .lhe-photo, #lifepoint-home-events .lhe-bar { background: linear-gradient(90deg, #444 0%, #555 50%, #444 100%); background-size: 200% 100%; animation: lhe-shimmer 1.4s ease-in-out infinite; }
#lifepoint-home-events .lhe-bar { display: block; height: 1rem; width: 80%; border-radius: 6px; margin-top: 6px; }
#lifepoint-home-events .lhe-bar--s { height: .7rem; width: 45%; margin-top: 0; }
@keyframes lhe-shimmer { from { background-position: 100% 0; } to { background-position: -100% 0; } }
@media (prefers-reduced-motion: reduce) { #lifepoint-home-events .lhe-skel * { animation: none !important; } }
#lifepoint-home-events .lhe-status a { color: #FFFBF0; text-decoration: underline; }
</style>

<script>
(() => {
  const root = document.getElementById('lifepoint-home-events');
  const list = root.querySelector('.lhe-list');
  const status = root.querySelector('.lhe-status');
  const allEvents = root.querySelector('.lhe-all').href;
  const feed = new URL('https://lifepointchurchrothwell.churchsuite.com/-/calendar/9a5e6d75-319d-43a1-9782-0e325a0838c1/json');
  const timeZone = 'Australia/Brisbane';
  const dateFormat = new Intl.DateTimeFormat('en-AU', {
    weekday: 'short', day: 'numeric', month: 'short', timeZone
  });
  const timeFormat = new Intl.DateTimeFormat('en-AU', {
    hour: 'numeric', minute: '2-digit', hour12: true, timeZone
  });
  const dayFormat = new Intl.DateTimeFormat('en-CA', {
    year: 'numeric', month: '2-digit', day: '2-digit', timeZone
  });

  function element(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text) node.textContent = text;
    return node;
  }

  function safeUrl(value, origin) {
    if (!value) return '';
    try {
      const url = new URL(value, origin);
      return url.origin === origin ? url.href : '';
    } catch {
      return '';
    }
  }

  function nextEvents(events, now) {
    return events.filter(event => {
      if (!event.starts_at || !event.name?.trim() || /^(cancelled|canceled)$/i.test(event.status || '')) return false;
      const start = new Date(event.starts_at);
      const end = new Date(event.ends_at);
      if (!Number.isFinite(+start)) return false;
      if (event.all_day) {
        if (event.ends_at && end > start) return end >= now;
        return dayFormat.format(start) >= dayFormat.format(now);
      }
      return (event.ends_at && end > start ? end : start) >= now;
    }).sort((a, b) => new Date(a.starts_at) - new Date(b.starts_at)).slice(0, 5);
  }

  function renderEvent(event, index) {
    const featured = index === 0;
    const item = element('li', featured ? 'lhe-item lhe-feature' : 'lhe-item');
    const link = element('a', 'lhe-link');
    link.href = safeUrl(event.url, feed.origin) || allEvents;
    const frame = element('span', 'lhe-photo');
    frame.setAttribute('aria-hidden', 'true');
    const image = safeUrl(featured
      ? event.image?.large || event.image?.medium || event.image?.small
      : event.image?.small || event.image?.medium || event.image?.large, 'https://cdn.churchsuite.com');
    if (image) {
      const img = element('img');
      img.src = image;
      img.alt = '';
      img.loading = 'lazy';
      img.decoding = 'async';
      img.addEventListener('error', () => img.remove(), { once: true });
      frame.append(img);
    }

    const start = new Date(event.starts_at);
    const venue = event.location?.name?.trim();
    const details = [dateFormat.format(start), event.all_day ? 'All day' : timeFormat.format(start), venue]
      .filter(Boolean).join(' · ');
    const copy = element('span');
    copy.append(element('span', 'lhe-meta', details), element('span', 'lhe-title', event.name));
    const arrow = element('span', 'lhe-arrow', '↗');
    arrow.setAttribute('aria-hidden', 'true');
    link.append(frame, copy, arrow);
    item.append(link);
    return item;
  }


  function addEventSchema(items) {
    const data = items.filter(e => e.starts_at && e.name).slice(0, 20).map(e => {
      const out = { '@type': 'Event', name: e.name.trim(), startDate: e.starts_at,
        eventAttendanceMode: 'https://schema.org/OfflineEventAttendanceMode', eventStatus: 'https://schema.org/EventScheduled',
        organizer: { '@type': 'Organization', name: 'Lifepoint Church', url: 'https://www.lifepoint.org.au/' } };
      if (e.ends_at) out.endDate = e.ends_at;
      if (e.url) out.url = e.url;
      const img = e.image && (e.image.large || e.image.medium || e.image.small);
      if (img) out.image = img;
      const loc = e.location && e.location.name;
      out.location = { '@type': 'Place', name: loc || 'Lifepoint Church', address: (e.location && e.location.address) || loc || 'Rothwell QLD' };
      return out;
    });
    if (!data.length) return;
    // Replace the list written in at build time, so Google never sees two copies.
    document.getElementById('lhe-ld')?.remove();
    const s = document.createElement('script');
    s.type = 'application/ld+json';
    s.id = 'lhe-ld';
    s.textContent = JSON.stringify({ '@context': 'https://schema.org', '@graph': data });
    document.head.append(s);
  }

  async function load() {
    const events = [];
    let page = 1;
    while (page) {
      const url = new URL(feed);
      url.searchParams.set('page', page);
      const response = await fetch(url, { credentials: 'omit', cache: 'no-cache' });
      if (!response.ok) throw new Error('Events feed unavailable');
      const data = await response.json();
      if (!Array.isArray(data.events)) throw new Error('Invalid events feed');

      for (const event of data.events) events.push(event);
      const next = Number(data.pagination?.next_page);
      page = Number.isSafeInteger(next) && next > page ? next : 0;
    }

    const upcoming = nextEvents(events, new Date());
    list.replaceChildren(...upcoming.map(renderEvent));
    status.classList.remove('lhe-sr');
    if (upcoming.length) { status.hidden = true; addEventSchema(upcoming); }
    else status.textContent = 'No upcoming events are listed right now.';
  }

  load().catch(() => {
    // ChurchSuite couldn't be reached: keep the list written in when the site was built.
    if (list.hasAttribute('data-built')) return;
    list.replaceChildren();
    status.classList.remove('lhe-sr');
    status.innerHTML = 'Upcoming events could not load just now. <a href="https://lifepointchurchrothwell.churchsuite.com/-/calendar/9a5e6d75-319d-43a1-9782-0e325a0838c1">Browse the calendar on ChurchSuite</a>.';
  });
})();
</script>
